<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Xbox 360</title>
    <style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
:root { --bleed-x: 24px; --bleed-y: 24px; }
#stage { position: absolute; inset: var(--bleed-y) var(--bleed-x); display: flex; align-items: center; justify-content: center; }
#stage[data-x="left"] { justify-content: flex-start; }
#stage[data-x="right"] { justify-content: flex-end; }
#stage[data-y="top"] { align-items: flex-start; }
#stage[data-y="bottom"] { align-items: flex-end; }

.achievement-wrapper {
  zoom: 1.4;
  opacity: 0;
  max-width: fit-content;
  border-radius: 30px;
  box-shadow: 0 0 0 1px #1c1c1c, 0 1px 3px rgba(0, 0, 0, 0.35);
  transition: opacity 70ms ease-out;
}

.achievement-wrapper.in {
  opacity: 1;
}

.achievement-wrapper.gone {
  opacity: 0;
  transition: opacity 60ms ease-in;
}

.achievement-inside {
  overflow: hidden;
  display: flex;
  align-items: center;
  gap: 10px;
  box-sizing: border-box;
  width: 60px;
  height: 60px;
  padding: 5px;
  border: 2px solid #8d8d8d;
  border-radius: 30px;
  background-color: #464646;
  color: #fff;
  font-family: "Segoe UI", sans-serif;
  font-size: 16px;
  transition: width 230ms cubic-bezier(0.2, 0.8, 0.2, 1);
}

.open .achievement-inside {
  width: var(--open, 280px);
}

.closing .achievement-inside {
  width: 60px;
  transition: width 150ms cubic-bezier(0.4, 0, 1, 1);
}

.achievement-art {
  position: relative;
  flex: none;
  width: 46px;
  height: 46px;
}

.art-disc,
.art-ring {
  position: absolute;
  border-radius: 50%;
  opacity: 0;
  transition: opacity 100ms ease-out, scale 100ms ease-out;
}

.art-disc {
  inset: 0;
  background: #0b0b0b;
}

.art-ring {
  inset: 2px;
  background: #8e8e8e;
  -webkit-mask: radial-gradient(closest-side, transparent calc(100% - 5.5px), #000 calc(100% - 5px));
  mask: radial-gradient(closest-side, transparent calc(100% - 5.5px), #000 calc(100% - 5px));
}

.art-ring::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(#0b0b0b, #0b0b0b) center / 4px 100% no-repeat,
    linear-gradient(#0b0b0b, #0b0b0b) center / 100% 4px no-repeat;
}

.art-green {
  position: absolute;
  inset: 0;
  background: conic-gradient(transparent 0deg 270deg, #9ad43a 270deg 360deg);
  transition: opacity 100ms linear;
}

.settled .art-disc,
.settled .art-ring {
  opacity: 1;
}

.dim .art-green {
  opacity: 0;
}

.ring-out .art-disc,
.ring-out .art-ring {
  opacity: 0;
  scale: 0.85;
  transition: opacity 100ms ease-in, scale 100ms ease-in;
}

.art-inner {
  position: absolute;
  inset: 0;
  z-index: 1;
  opacity: 0;
  scale: 0.85;
}

.open .art-inner {
  animation: art-pop 230ms ease-out;
}

.settled .art-inner {
  opacity: 1;
  scale: 1;
}

.icon-out .art-inner {
  opacity: 0;
  scale: 0;
  transition: opacity 100ms ease-in, scale 100ms ease-in;
}

.art-phase {
  position: absolute;
  inset: 0;
  margin: auto;
  opacity: 0;
  transition: opacity 130ms ease-in;
}

.art-phase.art-altered {
  opacity: 1;
  transition: opacity 70ms ease-out 130ms;
}

.art-phase-1 {
  width: 26px;
  height: 26px;
}

.art-phase-2 {
  width: 29px;
}

.achievement-text {
  display: flex;
  flex: none;
  flex-direction: column;
  gap: 3px;
  justify-content: center;
  text-wrap: nowrap;
}

.achievement-text > div {
  overflow: hidden;
  text-overflow: ellipsis;
}

@keyframes art-pop {
  0% { opacity: 0; scale: 0.85; }
  45% { opacity: 1; scale: 1.3; }
  100% { opacity: 1; scale: 1; }
}

@media (prefers-reduced-motion: reduce) {
  #stage *, #stage *::before, #stage *::after { transition: none; animation: none; }
}
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script>
(() => {
  const T = { open: 70, settle: 300, firstSwap: 560, period: 1000, ringOut: 5800, iconOut: 5900, close: 5980, gone: 6130, end: 6200 };
  const OPEN = 280;
  const MAX_OPEN = 314;
  const ART = 46;
  const KINDS = ["unlock", "rare", "platinum", "progress"];
  const TROPHY = '<svg class="art-phase-1 art-phase" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path fill="#fff" d="M208.3 64L432.3 64C458.8 64 480.4 85.8 479.4 112.2C479.2 117.5 479 122.8 478.7 128L528.3 128C554.4 128 577.4 149.6 575.4 177.8C567.9 281.5 514.9 338.5 457.4 368.3C441.6 376.5 425.5 382.6 410.2 387.1C390 415.7 369 430.8 352.3 438.9L352.3 512L416.3 512C434 512 448.3 526.3 448.3 544C448.3 561.7 434 576 416.3 576L224.3 576C206.6 576 192.3 561.7 192.3 544C192.3 526.3 206.6 512 224.3 512L288.3 512L288.3 438.9C272.3 431.2 252.4 416.9 233 390.6C214.6 385.8 194.6 378.5 175.1 367.5C121 337.2 72.2 280.1 65.2 177.6C63.3 149.5 86.2 127.9 112.3 127.9L161.9 127.9C161.6 122.7 161.4 117.5 161.2 112.1C160.2 85.6 181.8 63.9 208.3 63.9zM165.5 176L113.1 176C119.3 260.7 158.2 303.1 198.3 325.6C183.9 288.3 172 239.6 165.5 176zM444 320.8C484.5 297 521.1 254.7 527.3 176L475 176C468.8 236.9 457.6 284.2 444 320.8z"/></svg>';
  const stage = document.getElementById("stage");
  let timers = [];

  const make = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  const reset = () => {
    for (const timer of timers) clearTimeout(timer);
    timers = [];
    stage.replaceChildren();
  };

  const at = (ms, fn) => timers.push(setTimeout(fn, ms));

  const kindOf = (data) => {
    if (KINDS.includes(data.kind)) return data.kind;
    if (data.platinum) return "platinum";
    return data.rare ? "rare" : "unlock";
  };

  const lines = (data, kind) => {
    const labels = data.labels || {};
    if (kind === "platinum") return [labels.platinum || "", data.game || ""];
    if (kind === "rare") return [labels.rare || "", data.displayName || ""];
    if (kind === "progress") return [labels.progress || "", data.displayName || ""];
    return [labels.unlocked || data.unlockedLabel || "", data.displayName || ""];
  };

  const build = (data) => {
    const [header, footer] = lines(data, kindOf(data));
    const wrapper = make("div", "achievement-wrapper");
    const inside = make("div", "achievement-inside");
    const art = make("div", "achievement-art");
    const ring = make("div", "art-ring");
    ring.append(make("div", "art-green"));
    const inner = make("div", "art-inner");
    inner.innerHTML = TROPHY;
    const logo = make("img", "art-phase-2 art-phase art-altered");
    logo.src = "xbox.svg";
    logo.alt = "";
    inner.append(logo);
    art.append(make("div", "art-disc"), ring, inner);
    const text = make("div", "achievement-text");
    text.append(make("div", "text-header", header), make("div", "text-footer", footer));
    inside.append(art, text);
    wrapper.append(inside);
    return { wrapper, inside, text, trophy: inner.querySelector(".art-phase-1"), logo };
  };

  const show = (data = {}) => {
    reset();
    const [y, x] = (data.position || "middle-center").split("-");
    stage.dataset.x = x;
    stage.dataset.y = y;
    if (typeof data.scale === "number" && data.scale > 0) document.documentElement.style.zoom = String(data.scale);
    const { wrapper, inside, text, trophy, logo } = build(data);
    stage.append(wrapper);
    const style = getComputedStyle(inside);
    const edge = Number.parseFloat(style.paddingLeft) + Number.parseFloat(style.borderLeftWidth);
    const fixed = ART + Number.parseFloat(style.columnGap) + edge * 2;
    const open = Math.min(MAX_OPEN, Math.max(OPEN, Math.ceil(fixed + text.scrollWidth + 12)));
    text.style.maxWidth = `${open - fixed - 12}px`;
    wrapper.style.setProperty("--open", `${open}px`);
    void wrapper.offsetWidth;
    wrapper.classList.add("in");
    at(T.open, () => wrapper.classList.add("open"));
    at(T.settle, () => wrapper.classList.add("settled"));
    let showLogo = false;
    let last = T.firstSwap;
    for (let when = T.firstSwap; when < T.ringOut; when += T.period) {
      const logoTurn = showLogo;
      at(when, () => {
        trophy.classList.toggle("art-altered", !logoTurn);
        logo.classList.toggle("art-altered", logoTurn);
      });
      last = when;
      showLogo = !showLogo;
    }
    at(last, () => wrapper.classList.add("dim"));
    at(T.ringOut, () => wrapper.classList.add("ring-out"));
    at(T.iconOut, () => wrapper.classList.add("icon-out"));
    at(T.close, () => wrapper.classList.add("closing"));
    at(T.gone, () => wrapper.classList.add("gone"));
    at(T.end, reset);
  };

  if (window.api && typeof window.api.onNotification === "function") window.api.onNotification(show);
  else window.__awShow = show;
})();
    </script>
  </body>
</html>
