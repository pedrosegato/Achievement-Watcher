<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>PlayStation 4</title>
    <style>
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
:root { --bleed-x: 32px; --bleed-y: 32px; }
#stage { position: absolute; inset: var(--bleed-y) var(--bleed-x); display: flex; align-items: center; justify-content: center; }
#stage[data-x="left"] { justify-content: flex-start; }
#stage[data-x="right"] { justify-content: flex-end; }
#stage[data-y="top"] { align-items: flex-start; }
#stage[data-y="bottom"] { align-items: flex-end; }
#stage { --slide: -24px; }
#stage[data-x="right"] { --slide: 24px; }
@font-face { font-family: "SST"; src: url("SST.ttf"); font-weight: 400; }
@font-face { font-family: "SST"; src: url("SSTLight.ttf"); font-weight: 300; }
.cup { flex: none; display: block; width: auto; height: 1.2em; }

.ps4 {
  position: relative; display: flex; align-items: center; gap: 16px;
  height: 70px; min-width: 330px; max-width: 500px; box-sizing: border-box; padding: 0 14px;
  background: rgba(0, 0, 0, .86); border: 1px solid rgba(255, 255, 255, .16); border-radius: 3px;
  box-shadow: 0 6px 22px rgba(0, 0, 0, .45); font-family: "SST", "Segoe UI", sans-serif; color: #e8e8e8;
  opacity: 0; transform: translateX(var(--slide)); transition: opacity 240ms ease, transform 320ms cubic-bezier(.2, .8, .2, 1);
}
.ps4.in { opacity: 1; transform: none; }
.ps4.out { opacity: 0; transform: translateX(var(--slide)); transition: opacity 260ms ease, transform 300ms cubic-bezier(.4, 0, 1, 1); }
.ps4-icon { flex: none; width: 44px; height: 44px; box-sizing: border-box; border: 2px solid #d9d9d9; background: #111; }
.ps4-icon img { display: block; width: 100%; height: 100%; object-fit: cover; }
.ps4-text { display: flex; flex-direction: column; min-width: 0; margin-right: auto; }
.ps4-title { font-weight: 300; font-size: 20px; line-height: 1.15; color: #f2f2f2; white-space: nowrap; }
.ps4-name { display: flex; align-items: center; gap: 6px; font-size: 16px; line-height: 1.25; color: #c4c4c4; min-width: 0; }
.ps4-name span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ps4-logo { flex: none; display: grid; place-items: center; width: 32px; height: 32px; margin-left: 14px; border-radius: 50%; background: #fdfdfd; }
.ps4-logo img { width: 21px; height: 21px; }
@media (prefers-reduced-motion: reduce) {
  #stage *, #stage *::before, #stage *::after { transition: none; animation: none; }
}
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script>
(() => {
  const HOLD = 5400;
  const END = 5800;
  const stage = document.getElementById("stage");
  let timers = [];
  const make = (tag, className, text) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  };
  const icon = (data, className) => {
    const wrap = make("span", className);
    const src = data.icon || data.iconPath;
    if (src) {
      const image = make("img");
      image.alt = "";
      image.src = src;
      wrap.append(image);
    }
    return wrap;
  };
  const reset = () => {
    for (const timer of timers) clearTimeout(timer);
    timers = [];
    stage.replaceChildren();
  };
  const at = (ms, fn) => timers.push(setTimeout(fn, ms));
  const trophy = (data) => {
    if (data.kind === "platinum" || data.platinum) return "platinum";
    if (data.percent == null) return "bronze";
    if (data.percent < 10) return "gold";
    return data.percent <= 30 ? "silver" : "bronze";
  };
  const cupFor = (data) => {
    const cup = make("img", "cup");
    cup.alt = "";
    cup.src = `trophy-${trophy(data)}.png`;
    return cup;
  };
  const build = (data) => {
    const labels = data.labels || {};
    const root = make("div", "ps4");
    const text = make("div", "ps4-text");
    const name = make("div", "ps4-name");
    name.append(cupFor(data), make("span", "", data.displayName || ""));
    text.append(make("div", "ps4-title", labels.trophyEarned || ""), name);
    const logo = make("span", "ps4-logo");
    const mark = make("img");
    mark.alt = "";
    mark.src = "psicon.png";
    logo.append(mark);
    root.append(icon(data, "ps4-icon"), text, logo);
    return root;
  };
  const show = (data = {}) => {
    reset();
    const [y, x] = (data.position || "middle-center").split("-");
    stage.dataset.x = x;
    stage.dataset.y = y;
    if (typeof data.scale === "number" && data.scale > 0) document.documentElement.style.zoom = String(data.scale);
    const node = build(data);
    stage.append(node);
    void node.offsetWidth;
    node.classList.add("in");

    at(HOLD, () => node.classList.add("out"));
    at(END, reset);
  };
  if (window.api && typeof window.api.onNotification === "function") window.api.onNotification(show);
  else window.__awShow = show;
})();
    </script>
  </body>
</html>
