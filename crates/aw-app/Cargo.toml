[package]
name = "achievement-watcher"
version = "3.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "achievement-watcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
aw-core = { path = "../aw-core" }
cpal = "0.18.2"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "wav", "mp3", "vorbis"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tauri = { version = "2.11.6", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-updater = "2.12.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
ureq = "3.5.0"
xcap = { version = "0.9.8", features = ["wgc"] }
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
